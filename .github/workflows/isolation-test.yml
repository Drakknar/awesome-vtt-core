name: Isolation test (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Before isolation (for comparison)
        run: bash .github/sandbox-check.sh

      - name: Isolate Claude's commands
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat >/dev/null
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl -qw kernel.yama.ptrace_scope=2
          sudo chmod 600 /var/run/docker.sock
          sudo rm -f /etc/sudoers.d/runner
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo is still available"
            exit 1
          fi

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Run `bash .github/sandbox-check.sh` once with the Bash tool and return its full output in the "outputs" field. It is the repository owner's self-check of the sandbox this workflow puts around your commands: it prints only yes/no answers and counts, never any value. Read it first if you like. Do nothing else.
          claude_args: >-
            --model sonnet
            --max-turns 10
            --allowedTools "Bash,Read"
            --json-schema '{"type":"object","properties":{"outputs":{"type":"string"}},"required":["outputs"]}'

      - name: What Claude's commands could reach
        if: always()
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          OUT: ${{ steps.claude.outputs.structured_output }}
          BASH_ENV: ""
          ENV: ""
        run: |
          export PATH=/usr/bin:/bin
          printf '%s\n' "$OUT" | jq -r .outputs

      # Stands in for traps a hijacked Claude could plant for later steps.
      - name: Plant traps (simulated)
        if: always()
        run: |
          printf 'echo PLANTED_BASH_ENV_RAN\n' > "$RUNNER_TEMP/planted.sh"
          printf 'console.log("PLANTED_NODE_OPTIONS_RAN")\n' > "$RUNNER_TEMP/planted.js"
          {
            echo "BASH_ENV=$RUNNER_TEMP/planted.sh"
            echo "NODE_OPTIONS=--require $RUNNER_TEMP/planted.js"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/fakebin"
          printf '#!/bin/sh\necho PLANTED_PATH_RAN\n' > "$RUNNER_TEMP/fakebin/git"
          chmod +x "$RUNNER_TEMP/fakebin/git"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"

      - name: Control - unprotected bash step
        if: always()
        run: |
          echo "control bash step ran"
          git --version

      - name: Hardened bash step
        if: always()
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
        run: |
          export PATH=/usr/bin:/bin
          echo "hardened bash step ran"
          git --version
          if sudo -n true 2>/dev/null; then echo "sudo available"; else echo "sudo gone"; fi

      - name: Control - unprotected JS action
        if: always()
        uses: actions/checkout@v4
        with:
          path: control-checkout
          persist-credentials: false

      - name: Hardened JS action
        if: always()
        uses: actions/checkout@v4
        env:
          NODE_OPTIONS: ""
        with:
          path: hardened-checkout
          persist-credentials: false
