name: Checks

# The checks live in Drakknar/ci-workflows, pinned to a commit. Runs on every pull request (Dependabot's included) and on
# pushes to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: Drakknar/ci-workflows/.github/workflows/foundry-module.yml@2de469f6d42667eedb5562376159cd8cdf8da628 # main
